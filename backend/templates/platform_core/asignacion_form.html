<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f8; }
        h1 { margin-bottom: 20px; }
        form {
            background: white; padding: 20px; max-width: 800px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select {
            width: 100%; padding: 10px; margin-top: 6px;
            border: 1px solid #ccc; border-radius: 6px;
        }
        .btn {
            display: inline-block; padding: 10px 14px; text-decoration: none;
            background: #2563eb; color: white; border-radius: 6px; border: none; margin-top: 16px;
        }
        .btn-gray { background: #6b7280; }
    </style>
</head>
<body>
    <h1>{{ titulo }}</h1>

    <form method="post">
        {% csrf_token %}

        <label>Vehículo</label>
        <select name="vehiculo" required>
            <option value="">Seleccione un vehículo</option>
            {% for vehiculo in vehiculos %}
                <option value="{{ vehiculo.id }}"
                    {% if asignacion and asignacion.vehiculo.id == vehiculo.id %}selected{% endif %}>
                    {{ vehiculo.placa }} - {{ vehiculo.marca }} {{ vehiculo.modelo }}
                </option>
            {% endfor %}
        </select>

        <label>Empleado</label>
        <select name="empleado" required>
            <option value="">Seleccione un empleado</option>
            {% for empleado in empleados %}
                <option value="{{ empleado.id }}"
                    {% if asignacion and asignacion.empleado.id == empleado.id %}selected{% endif %}>
                    {{ empleado.numero_empleado }} - {{ empleado.nombre_completo }}
                </option>
            {% endfor %}
        </select>

        <label>
            <input type="checkbox" name="activa" {% if asignacion.activa or asignacion == None %}checked{% endif %}>
            Activa
        </label>

        <button type="submit" class="btn">Guardar</button>
        <a href="{% url 'web-asignaciones' %}" class="btn btn-gray">Volver</a>
    </form>
</body>
</html>
