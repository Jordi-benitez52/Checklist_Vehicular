<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f8; }
        h1 { margin-bottom: 20px; }
        form {
            background: white; padding: 20px; max-width: 800px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input {
            width: 100%; padding: 10px; margin-top: 6px;
            border: 1px solid #ccc; border-radius: 6px;
        }
        .btn {
            display: inline-block; padding: 10px 14px; text-decoration: none;
            background: #2563eb; color: white; border-radius: 6px; border: none; margin-top: 16px;
        }
        .btn-gray { background: #6b7280; }
    </style>
</head>
<body>
    <h1>{{ titulo }}</h1>

    <form method="post">
        {% csrf_token %}

        <label>Nombre completo</label>
        <input type="text" name="nombre_completo" value="{{ conductor.nombre_completo|default:'' }}" required>

        <label>Licencia</label>
        <input type="text" name="licencia" value="{{ conductor.licencia|default:'' }}">

        <label>Teléfono</label>
        <input type="text" name="telefono" value="{{ conductor.telefono|default:'' }}">

        <label>Empresa</label>
        <input type="text" name="empresa" value="{{ conductor.empresa|default:'' }}">

        <label>
            <input type="checkbox" name="activo" {% if conductor.activo or conductor == None %}checked{% endif %}>
            Activo
        </label>

        <button type="submit" class="btn">Guardar</button>
        <a href="{% url 'web-conductores' %}" class="btn btn-gray">Volver</a>
    </form>
</body>
</html>
